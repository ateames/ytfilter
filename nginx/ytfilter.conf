# ytfilter — nginx reverse proxy with TLS
#
# Install: see nginx/INSTALL.md
#
# Replace certificate paths with your mkcert (or other) PEM files.
# Flask should listen on 127.0.0.1:5000 (set PORT=5000 in .env).

upstream ytfilter {
    server 127.0.0.1:5000;
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name youtube.com www.youtube.com m.youtube.com youtube.home;
    return 301 https://$host$request_uri;
}

# youtube.com variants → redirect to the curated app
server {
    listen 443 ssl;
    server_name youtube.com www.youtube.com m.youtube.com;

    ssl_certificate     /etc/ssl/ytfilter/youtube.com+2.pem;
    ssl_certificate_key /etc/ssl/ytfilter/youtube.com+2-key.pem;

    return 302 https://youtube.home;
}

# Main app at youtube.home
server {
    listen 443 ssl;
    server_name youtube.home;

    ssl_certificate     /etc/ssl/ytfilter/youtube.com+2.pem;
    ssl_certificate_key /etc/ssl/ytfilter/youtube.com+2-key.pem;

    location / {
        proxy_pass http://ytfilter;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
