<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube is blocked</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        height: 100%;
      }

      body {
        min-height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0f0f0f;
        color: #f1f1f1;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        line-height: 1.5;
        padding: 1.5rem;
      }

      .blocked-page {
        max-width: 28rem;
        width: 100%;
        text-align: center;
      }

      .blocked-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 5rem;
        height: 5rem;
        margin-bottom: 1.75rem;
        position: relative;
      }

      .blocked-icon__play {
        width: 0;
        height: 0;
        border-style: solid;
        border-width: 1.5rem 0 1.5rem 2.5rem;
        border-color: transparent transparent transparent #ff0000;
        margin-left: 0.5rem;
      }

      .blocked-icon__slash {
        position: absolute;
        width: 5.5rem;
        height: 0.3rem;
        background: #ff0000;
        border-radius: 0.15rem;
        transform: rotate(-45deg);
      }

      h1 {
        font-size: clamp(1.35rem, 4vw, 1.75rem);
        font-weight: 600;
        margin-bottom: 0.75rem;
        letter-spacing: -0.02em;
      }

      .blocked-subtext {
        font-size: 1rem;
        color: #aaaaaa;
        margin-bottom: 2rem;
      }

      .blocked-cta {
        display: inline-block;
        width: 100%;
        max-width: 20rem;
        padding: 1rem 1.5rem;
        background: #ff0000;
        color: #ffffff;
        font-size: 1.1rem;
        font-weight: 600;
        text-decoration: none;
        border-radius: 2rem;
        transition: background 0.15s ease;
      }

      .blocked-cta:hover,
      .blocked-cta:focus {
        background: #cc0000;
      }

      .blocked-cta:focus {
        outline: 2px solid #ffffff;
        outline-offset: 3px;
      }

      .blocked-footer {
        margin-top: 2rem;
        font-size: 0.8rem;
        color: #717171;
      }
    </style>
  </head>
  <body>
    <main class="blocked-page">
      <div class="blocked-icon" aria-hidden="true">
        <span class="blocked-icon__play"></span>
        <span class="blocked-icon__slash"></span>
      </div>

      <h1>YouTube is blocked on this network</h1>
      <p class="blocked-subtext">
        You can still watch approved videos on the family filter.
      </p>

      <a class="blocked-cta" href="http://youtube.home">Go to YouTube Home →</a>

      <p class="blocked-footer">
        {% if blocked_from %}
          {{ blocked_from }} is blocked by your network admin.
        {% else %}
          youtube.com is blocked by your network admin.
        {% endif %}
      </p>
    </main>
  </body>
</html>
