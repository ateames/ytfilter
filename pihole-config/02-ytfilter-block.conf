# ytfilter - YouTube block page redirect
# Place this file at: /etc/dnsmasq.d/02-ytfilter-block.conf
# Then restart Pi-hole DNS: pihole restartdns
#
# SETUP NOTES:
# - Replace 192.168.1.50 with your Pi's actual static IP address.
# - This works alongside Pi-hole's domain blocklist. The address= directive
#   in dnsmasq takes precedence and points the domain to your Pi's IP rather
#   than 0.0.0.0, which is what allows the custom block page to load.
# - The Flask app must be running on port 80 for this to work.
# - youtu.be and googlevideo.com should remain blocked (pointed to 0.0.0.0)
#   via Pi-hole's normal blocklist since those domains don't need a landing page.

# Point youtube.com and www.youtube.com to this Pi's IP
# so Flask can serve the custom block page at /blocked
address=/youtube.com/192.168.1.50
address=/www.youtube.com/192.168.1.50
address=/m.youtube.com/192.168.1.50

# youtube.home resolves to this Pi (local friendly URL)
address=/youtube.home/192.168.1.50
